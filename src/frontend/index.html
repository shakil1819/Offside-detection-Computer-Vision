<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlético Intelligence - Offside & Goal Detection</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>⚽ Atlético Intelligence</h1>
            <p>Offside & Goal Detection via Computer Vision</p>
        </header>

        <!-- Upload Section -->
        <section id="uploadSection" class="section upload-section">
            <h2>Upload Video</h2>
            <div class="upload-box">
                <input
                    type="file"
                    id="videoInput"
                    accept="video/*"
                    style="display: none;">
                <button id="uploadBtn" class="btn btn-primary btn-large">
                    📹 Choose Video
                </button>
                <p id="fileName" class="file-name"></p>
                <p class="help-text">Max 500 MB • Supported: MP4, AVI, MOV, MKV</p>
            </div>

            <!-- Progress Section -->
            <div id="progressSection" style="display: none;" class="progress-section">
                <h3>Processing...</h3>
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
                <p id="progressText" class="progress-text">0%</p>
            </div>
        </section>

        <!-- Results Section -->
        <section id="resultsSection" class="section results-section" style="display: none;">
            <h2>Results</h2>

            <!-- Verdict Card -->
            <div class="verdict-card">
                <h3>Incident Analysis</h3>
                <div class="verdict-badge" id="verdictBadge">
                    <span id="verdictText">OFFSIDE</span>
                    <span id="confidenceText" class="confidence">(92% confidence)</span>
                </div>
            </div>

            <!-- Video Player -->
            <div class="video-container">
                <h3>Processed Video</h3>
                <video id="resultVideo" controls>
                    <source id="videoSource" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>

            <!-- Actions -->
            <div class="actions">
                <button id="downloadBtn" class="btn btn-secondary">
                    📥 Download Results
                </button>
                <button id="newUploadBtn" class="btn btn-primary">
                    📹 Process Another Video
                </button>
            </div>
        </section>

        <!-- Error Section -->
        <section id="errorSection" class="section error-section" style="display: none;">
            <h2>Error</h2>
            <div class="error-box">
                <p id="errorText"></p>
                <button id="retryBtn" class="btn btn-primary">
                    🔄 Try Again
                </button>
            </div>
        </section>

        <!-- Job History -->
        <section id="historySection" class="section history-section" style="display: none;">
            <h2>Recent Jobs</h2>
            <div id="jobsList" class="jobs-list">
                <!-- Jobs populated by JavaScript -->
            </div>
        </section>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/uploader.js"></script>
    <script src="js/status-poller.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
