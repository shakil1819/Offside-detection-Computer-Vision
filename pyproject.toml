[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "athletic-intelligence"
version = "0.1.0"
description = "AI-powered soccer incident review platform for grassroots leagues"
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [
    {name = "Shakil Mosharrof", email = "shakilmrf8@gmail.com"}
]
license = {text = "MIT"}
keywords = ["soccer", "offside", "detection", "kaggle", "yolo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Other Audience",
    "Topic :: Multimedia :: Video",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core ML (torch/ultralytics wheels available for 3.10-3.12)
    "ultralytics>=8.2.0,<9.0.0",
    "opencv-python>=4.8.0,<5.0.0",
    "numpy>=1.24.0",
    "pillow>=9.5.0",
    "matplotlib>=3.6.0",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    # Backend API
    "fastapi[standard]>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "kaggle>=1.5.13",
    "python-multipart>=0.0.6",
    "pydantic>=2.0.0",
    "aiofiles>=23.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[tool.uv]
package = false  # app, not a library — skip editable install, just resolve deps

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=src --cov-report=html --cov-report=term"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.fastapi]
entrypoint = "src.backend.main:app"
