[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "athletic-intelligence"
version = "0.1.0"
description = "AI-powered soccer incident review platform for grassroots leagues"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Shakil Mosharrof", email = "shakilmrf8@gmail.com"}
]
license = {text = "MIT"}
keywords = ["soccer", "offside", "detection", "kaggle", "yolo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Sport",
    "Topic :: Multimedia :: Video",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "ultralytics>=8.2.0,<9.0.0",
    "opencv-python>=4.8.0,<5.0.0",
    "numpy>=1.24.0,<2.0.0",
    "pillow>=9.5.0,<11.0.0",
    "matplotlib>=3.6.0,<4.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<8.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "black>=23.0.0,<24.0.0",
    "ruff>=0.1.0,<0.2.0",
]

[tool.uv]
python-version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=src --cov-report=html --cov-report=term"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W"]
ignore = ["E501"]  # Line too long (handled by black)
